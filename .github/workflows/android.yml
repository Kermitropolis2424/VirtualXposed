name: Android CI

on:
  push:
    branches: [ "dependency-workaround" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: dependency-workaround
    
    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: gradle
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@5bc54e77d3f78364d4e333b1c8eedcf9414c5e64 # Wait to merge https://github.com/nttld/setup-ndk/pull/573
      id: setup-ndk
      with:
        ndk-version: r21e
        local-cache: true
    
    - name: Build with Gradle
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        cd VirtualApp
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VirtualXposed-APK
        path: VirtualApp/app/build/outputs/apk/**/*.apk
